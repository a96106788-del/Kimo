
name: Build Kimo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Kimo ZIP
        run: |
          mkdir project
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kimo ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Add Android Dependencies
        run: |
          cat >> project/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Build Kimo
        run: |
          gradle -p project assembleDebug --no-daemon

      - name: Upload Kimo APK
        uses: actions/upload-artifact@v4
        with:
          name: Kimo-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
