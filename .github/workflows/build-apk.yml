   
name: Kimo APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root mein ZIP file nahi mili."
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: ZIP ke andar Android project root nahi mila."
            find project -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts nahi mili."
            exit 1
          fi

      - name: Add AndroidX dependencies
        run: |
          cat >> project/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Build Debug APK
        run: gradle -p project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kimo-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: 
